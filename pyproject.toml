[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-nextip"
version = "0.3.0"
description = "Add the next free IP address to a NetBox device or VM in one click, following admin rules."
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Matti" }]
# No runtime dependencies beyond NetBox (which brings Django). NetBox
# versions are enforced at runtime by min_version in netbox_nextip/__init__.py.
dependencies = []

[tool.setuptools.packages.find]
include = ["netbox_nextip*"]

[tool.setuptools.package-data]
netbox_nextip = [
    "templates/netbox_nextip/*.html",
    "templates/netbox_nextip/**/*.html",
]
