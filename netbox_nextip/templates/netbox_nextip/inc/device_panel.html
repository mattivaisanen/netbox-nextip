{% load i18n %}
<div class="card">
  <h2 class="card-header">{% trans "Next IP" %}</h2>
  <table class="table table-hover attr-table">
    {% include 'netbox_nextip/inc/plan_rows.html' %}
  </table>
  {% if can_add %}
  <div class="card-footer text-end">
    {% if not plan %}
      <button type="button" class="btn btn-primary" hx-get="{{ popup_url }}" hx-target="#htmx-modal-content"
              data-bs-toggle="modal" data-bs-target="#htmx-modal">
        <i class="mdi mdi-plus-thick"></i> {% trans "Add IP" %}…
      </button>
    {% else %}
      <form method="post" action="{{ add_url }}">
        {% csrf_token %}
        <input type="hidden" name="address" value="{{ plan.address }}">
        {# Another VLAN or a typed address, in the popup. #}
        <button type="button" class="btn btn-outline-secondary" hx-get="{{ popup_url }}" hx-target="#htmx-modal-content"
                data-bs-toggle="modal" data-bs-target="#htmx-modal" title="{% trans 'Pick another VLAN or type the address' %}">
          <i class="mdi mdi-pencil"></i> {% trans "Other IP" %}…
        </button>
        {% if plan.address %}
        <button type="submit" class="btn btn-primary" title="{% trans 'Create this address on the interface and make it the primary IP' %}">
          <i class="mdi mdi-plus-thick"></i> {% trans "Add IP" %}
        </button>
        {% endif %}
      </form>
    {% endif %}
  </div>
  {% endif %}
</div>
